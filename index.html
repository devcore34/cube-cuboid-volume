<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Куб, кубоид, объём (V) и ёмкость — 5 класс</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css?v=10" />
  <link rel="stylesheet" href="css/animations.css?v=10" />
  <link rel="stylesheet" href="css/responsive.css?v=10" />
</head>
<body class="mode-board">

  <!-- ====================================================================
       ШАПКА УРОКА ДЛЯ УЧЕНИКОВ (5 КЛАСС)
       ==================================================================== -->
  <header class="app-header" role="banner">
    <div class="header-top">
      <div class="brand-block">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <polygon points="32,6 56,18 32,30 8,18" fill="#67E8F9" stroke="#0E7490" stroke-width="3" stroke-linejoin="round"/>
            <polygon points="8,18 32,30 32,56 8,44" fill="#22D3EE" stroke="#0E7490" stroke-width="3" stroke-linejoin="round"/>
            <polygon points="32,30 56,18 56,44 32,56" fill="#06B6D4" stroke="#0E7490" stroke-width="3" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-titles">
          <h1>Куб, кубоид, объём (V) и ёмкость • 5 класс</h1>
          <div class="brand-subtitle">Интерактивные 3D-фигуры, кран с водой и запись в тетрадь (стр. 110)</div>
        </div>
      </div>

      <div class="header-tools">
        <button type="button" id="openNotebookSheetBtn" class="tool-pill notebook-header-btn" title="Открыть всю запись в тетрадь">
          📓 Вся запись в тетрадь
        </button>
        <button type="button" id="fullscreenHeaderBtn" class="tool-pill" title="Во весь экран">
          ⛶ Полный экран
        </button>
      </div>
    </div>

    <!-- Навигация по 4 пунктам темы + полная запись в тетрадь -->
    <div class="level-progress-bar" id="levelProgressBar">
      <div class="levels-track" id="levelsTrackContainer" role="navigation" aria-label="Разделы темы"></div>
    </div>
  </header>

  <!-- ====================================================================
       ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ
       ==================================================================== -->
  <main class="workspace-container" id="workspaceRoot" role="main"></main>

  <!-- ====================================================================
       НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ
       ==================================================================== -->
  <footer class="teacher-dock" role="contentinfo" aria-label="Навигация по теме">
    <div class="teacher-dock-inner">
      <div class="dock-group">
        <button type="button" class="dock-btn" id="dockPrevStepBtn" title="Назад">
          ◀ Назад
        </button>
        <button type="button" class="dock-btn dock-primary" id="dockNextStepBtn" title="Дальше">
          Дальше ▶
        </button>

        <div class="dock-divider" aria-hidden="true"></div>

        <button type="button" class="dock-btn dock-accent" id="dockSeparateToggleBtn" title="Разобрать на грани или открыть кран">
          🧩 Разобрать на грани
        </button>
        <button type="button" class="dock-btn" id="dockRepeatBtn" title="Сбросить чертёж">
          ↺ Сбросить
        </button>
      </div>

      <div class="dock-group">
        <button type="button" class="dock-btn dock-notebook" id="dockNotebookBtn" title="Открыть всю запись в тетрадь">
          ✍️ Запись в тетрадь
        </button>
        <button type="button" class="dock-btn" id="dockFullscreenBtn" title="Во весь экран">
          ⛶ Полный экран
        </button>
      </div>
    </div>
  </footer>

  <!-- Подключение модулей -->
  <script src="js/geometry3d.js?v=11"></script>
  <script src="js/animations.js?v=11"></script>
  <script src="js/navigation.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
</body>
</html>
